<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대입 상담 예약 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 0.95em; margin-bottom: 20px; }
        
        .reset-btn {
            position: absolute; right: 0; top: 10px;
            background-color: #e74c3c; color: white; border: none;
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .reset-btn:hover { background-color: #c0392b; }
        
        .date-container { text-align: center; margin-bottom: 30px; }
        .week-picker {
            padding: 10px 15px; font-size: 1.1em; border: 2px solid #bdc3c7;
            border-radius: 8px; color: #2c3e50; font-family: inherit; cursor: pointer; font-weight: bold;
        }
        .week-picker:focus { border-color: #3498db; outline: none; }

        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; max-width: 1200px; margin: 0 auto;
        }
        .day-col {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .day-col h3 {
            text-align: center; color: #34495e; border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px; margin-top: 0; font-size: 1.1em;
        }
        .slot {
            margin-bottom: 12px; padding: 15px 10px; background: #e3f2fd;
            color: #1565c0; cursor: pointer; text-align: center; border-radius: 8px;
            font-weight: bold; border: 2px solid #bbdefb; transition: all 0.2s;
        }
        .slot:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(33, 150, 243, 0.2); }
        
        .slot.reserved { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
        .slot.reserved:hover { box-shadow: 0 4px 8px rgba(244, 67, 54, 0.2); }
        
        .slot-time { font-size: 1.1em; margin-bottom: 5px; }
        .slot-status { font-size: 0.9em; font-weight: normal; }
        .empty-message { text-align: center; color: #7f8c8d; font-size: 0.95em; padding: 20px 0; }

        /* 로딩 스피너 오버레이 */
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999; 
            flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            border: 5px solid #f3f3f3; border-top: 5px solid #3498db;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header" style="max-width: 1200px; margin: 0 auto;">
        <h1> 3학년 3반 대입 상담 예약 시스템 🎓 with 성민쌤</h1>
        <p class="subtitle">우리 반 모든 학생은 '빠짐없이' 신청하세요.  (실시간 동기화)</p>
        <button class="reset-btn" onclick="clearAll()">전체 초기화(교사용)</button>
    </div>

    <div class="date-container">
        <input type="week" id="weekPicker" class="week-picker">
    </div>

    <div class="board" id="board">
        <!-- 시간표 생성 -->
    </div>

    <!-- 로딩 화면 -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: bold; color: #2c3e50;">데이터 처리 중...</p>
    </div>

    <script>
        // ★★★ 여기에 복사한 웹앱 URL을 붙여넣으세요 ★★★
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyalYtNda-umfKhg-cxmnePeAfn4TamqESCU-CNkG_lAH4BUyj-cEjkvJ8Tnkfw4A7j/exec";
        
        const scheduleByDay = {
            1: ["1교시", "7교시", "8교시", "9교시", "10교시", "11교시"],
            2: ["8교시", "9교시", "10교시", "11교시"],
            3: ["8교시", "9교시", "10교시", "11교시"],
            4: ["8교시", "9교시", "10교시", "11교시"],
            5: ["6교시", "7교시", "8교시", "9교시"]
        };
        const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
        
        const board = document.getElementById('board');
        const weekPicker = document.getElementById('weekPicker');
        const loader = document.getElementById('loader');

        let globalReservations = {}; // 서버에서 불러온 예약 데이터를 담는 객체

        weekPicker.addEventListener('change', render);

        function showLoader() { loader.style.display = 'flex'; }
        function hideLoader() { loader.style.display = 'none'; }

        // 서버(구글 시트)에 요청을 보내는 범용 함수
        async function fetchAppScript(data) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    // CORS preflight를 피하기 위해 text/plain 사용
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                return result;
            } catch (error) {
                console.error("통신 에러:", error);
                alert("서버와 통신 중 문제가 발생했습니다.");
            }
        }

        // 1. 실시간 데이터 불러오기
        async function loadData() {
            // 사용자가 화면을 조작 중일 때는 방해되지 않도록 백그라운드에서만 실행
            const result = await fetchAppScript({ action: 'read' });
            if (result && result.status === 'success') {
                globalReservations = result.data;
                render(); // 데이터가 갱신되면 화면 다시 그리기
            }
        }

        // 특정 주차 날짜 계산 
        function getDatesOfWeek(weekStr) {
            const [yearStr, weekNumStr] = weekStr.split('-W');
            const year = parseInt(yearStr, 10);
            const week = parseInt(weekNumStr, 10);
            const jan4 = new Date(year, 0, 4);
            const dayOfJan4 = jan4.getDay() || 7; 
            const firstMonday = new Date(jan4);
            firstMonday.setDate(jan4.getDate() - dayOfJan4 + 1);
            const targetMonday = new Date(firstMonday);
            targetMonday.setDate(firstMonday.getDate() + (week - 1) * 7);
            const dates = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(targetMonday);
                d.setDate(targetMonday.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 2. 시간표 화면 렌더링
        function render() {
            const selectedWeek = weekPicker.value;
            if (!selectedWeek) return;

            board.innerHTML = '';
            const weekDates = getDatesOfWeek(selectedWeek);

            weekDates.forEach((dateObj) => {
                const dayIndex = dateObj.getDay(); 
                const dateKey = formatDate(dateObj); 
                const displayTitle = `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayNames[dayIndex]})`;
                const times = scheduleByDay[dayIndex];

                const col = document.createElement('div');
                col.className = 'day-col';
                const title = document.createElement('h3');
                title.textContent = displayTitle;
                col.appendChild(title);

                if (!times || times.length === 0) {
                    col.innerHTML += `<p class="empty-message">상담 일정이<br>없습니다.</p>`;
                } else {
                    times.forEach(time => {
                        const slotKey = `counsel_${dateKey}_${time}`;
                        const reservedBy = globalReservations[slotKey]; // 서버 데이터 확인

                        const slotDiv = document.createElement('div');
                        slotDiv.className = `slot ${reservedBy ? 'reserved' : ''}`;
                        
                        if (reservedBy) {
                            slotDiv.innerHTML = `<div class="slot-time">🔒 ${time}</div><div class="slot-status">${reservedBy}</div>`;
                        } else {
                            slotDiv.innerHTML = `<div class="slot-time">🟢 ${time}</div><div class="slot-status">예약 가능</div>`;
                        }

                        // 클릭 시 서버 통신(예약/취소) 로직
                        slotDiv.onclick = async () => {
                            if (reservedBy) {
                                if (confirm(`[${displayTitle} ${time}]\n현재 예약자: ${reservedBy}\n\n예약을 취소하시겠습니까?`)) {
                                    showLoader();
                                    await fetchAppScript({ action: 'cancel', slotKey: slotKey });
                                    await loadData();
                                    hideLoader();
                                }
                            } else {
                                const name = prompt(`[${displayTitle} ${time}]\n학번과 이름을 입력해주세요. (예: 30301 홍길동)`);
                                if (name && name.trim() !== '') {
                                    showLoader();
                                    // 찰나의 순간에 다른 학생이 먼저 예약했는지 최종 확인을 서버에서 하는 로직이 추가되면 더 좋지만, 
                                    // 현재는 직관적인 덮어쓰기/순차 입력으로 처리됩니다.
                                    await fetchAppScript({ action: 'reserve', slotKey: slotKey, studentName: name.trim() });
                                    await loadData();
                                    hideLoader();
                                }
                            }
                        };
                        col.appendChild(slotDiv);
                    });
                }
                board.appendChild(col);
            });
        }

        // 3. 전체 초기화 함수
        async function clearAll() {
            if(confirm("모든 예약 데이터를 삭제하시겠습니까?\n이 작업은 선생님만 수행해야 하며, 되돌릴 수 없습니다.")) {
                const pass = prompt("선생님 확인용 비밀번호를 입력하세요.");
                if (pass === "1421") {
                    showLoader();
                    await fetchAppScript({ action: 'clearAll' });
                    await loadData();
                    hideLoader();
                    alert("전체 예약이 초기화되었습니다.");
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            }
        }

        function init() {
            const today = new Date();
            const d = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            weekPicker.value = `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
            
            // 최초 실행 시 서버에서 데이터 불러오기
            showLoader();
            loadData().then(() => hideLoader());

            // 5초마다 실시간으로 백그라운드에서 동기화 (새로고침 없이 실시간 반영)
            setInterval(loadData, 5000); 
        }

        init();
    </script>
</body>
</html>
